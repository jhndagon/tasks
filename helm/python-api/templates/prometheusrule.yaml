{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "python-api.fullname" . }}
  labels:
    {{- include "python-api.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "python-api.fullname" . }}.rules
      rules:
        - alert: TasksApiHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_requests_total[5m])), 1)
            ) > {{ .Values.metrics.prometheusRule.errorRateThreshold }}
          for: {{ .Values.metrics.prometheusRule.for }}
          labels:
            severity: warning
          annotations:
            summary: Tasks API high 5xx error rate
            description: The Tasks API 5xx error ratio is above the configured threshold.
        - alert: TasksApiHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
            ) > {{ .Values.metrics.prometheusRule.latencyP95ThresholdSeconds }}
          for: {{ .Values.metrics.prometheusRule.for }}
          labels:
            severity: warning
          annotations:
            summary: Tasks API high p95 latency
            description: The Tasks API p95 latency is above the configured threshold.
{{- end }}
